name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest test_google_health_client.py test_pipeline_logic.py -v
        env:
          # main.py builds its state path from this at import time
          STATE_DIRECTORY: ${{ runner.temp }}/state
